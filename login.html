<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apex Transport - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
        }

        .success {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
        }

        .forgot-link {
            text-align: right;
            margin-top: 10px;
        }

        a {
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Apex Transport</h1>

    <p class="subtitle">Log in to your account</p>

    <form id="loginForm">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <div class="forgot-link">
            <a href="#" id="forgotPassword">
                Forgot password?
            </a>
        </div>

        <button
            type="submit"
            id="loginButton"
        >
            LOG IN
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create an account</a>
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://hwgwflubmptadxadooyo.supabase.co";

/*
 IMPORTANT:
 Paste the SAME SUPABASE PUBLISHABLE KEY
 that you used in register.html.

 It starts with:
 sb_publishable_

 DO NOT use the sb_secret_ key.
*/

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CazTNV2OzvBuZIiHH9tlxA_GrwIzeKY";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.className =
        "message " + type;

    message.textContent =
        text;

    message.style.display =
        "block";
}


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;


        message.style.display =
            "none";

        loginButton.disabled =
            true;

        loginButton.textContent =
            "LOGGING IN...";


        try {

            /*
             * Sign in with email and password
             */

            const { data, error } =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password
                });


            if (error) {
                throw error;
            }


            /*
             * Make sure we received a user
             */

            if (!data.user) {

                throw new Error(
                    "Login was unsuccessful. Please try again."
                );

            }


            /*
             * Find this user's profile
             */

            const { data: profile, error: profileError } =
                await supabaseClient
                .from("profiles")
                .select("role, full_name")
                .eq("id", data.user.id)
                .single();


            if (profileError) {
                throw profileError;
            }


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            /*
             * Send the user to the correct dashboard
             */

            if (profile.role === "driver") {

                window.location.href =
                    "driver-dashboard.html";

            } else if (profile.role === "passenger") {

                window.location.href =
                    "passenger-dashboard.html";

            } else {

                throw new Error(
                    "Your account role could not be determined."
                );

            }

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to log in. Please check your email and password.",
                "error"
            );

        } finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "LOG IN";
        }

    }
);


/*
 * Forgot password
 */

document.getElementById(
    "forgotPassword"
).addEventListener(
    "click",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email")
            .value
            .trim();


        if (!email) {

            showMessage(
                "Please enter your email address first.",
                "error"
            );

            return;
        }


        try {

            const { error } =
                await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                        "https://quuenshizzle.github.io/apextransport/reset-password.html"
                    }
                );


            if (error) {
                throw error;
            }


            showMessage(
                "If this email is registered, a password reset email will be sent.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Unable to send the password reset email.",
                "error"
            );

        }

    }
);

</script>

</body>
</html>
